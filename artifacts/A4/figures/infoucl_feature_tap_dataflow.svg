<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="470" viewBox="0 0 1120 470" role="img" aria-labelledby="title desc">
  <title id="title">Pinned InfoUCL feature path and CTM observation hook</title>
  <desc id="desc">InfoUCL trains with two views through a ResNet18 InfoDrop backbone and SimSiam projector. Official kNN evaluation consumes the pooled backbone feature. The proposed CTM observer hooks that same feature after each task checkpoint.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#385b74"/></marker>
    <marker id="proposed" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#ad6b16"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;fill:#182b3a}.title{font-size:22px;font-weight:600}.label{font-size:16px;font-weight:600}.small{font-size:13px}.node{fill:#f1f6f8;stroke:#385b74;stroke-width:1.5;rx:10}.proposal{fill:#fff8eb;stroke:#ad6b16;stroke-width:1.5;rx:10}.edge{fill:none;stroke:#385b74;stroke-width:2;marker-end:url(#arrow)}.dash{fill:none;stroke:#ad6b16;stroke-width:2;stroke-dasharray:7 5;marker-end:url(#proposed)}
    </style>
  </defs>
  <text x="40" y="42" class="title">InfoUCL: verified backbone tap and proposed CTM observation path</text>
  <rect x="35" y="112" width="170" height="86" class="node"/><text x="120" y="143" text-anchor="middle" class="label">Two augmented views</text><text x="120" y="168" text-anchor="middle" class="small">CIFAR-10, 32 x 32</text>
  <rect x="270" y="102" width="220" height="106" class="node"/><text x="380" y="133" text-anchor="middle" class="label">ResNet-18 IFD</text><text x="380" y="158" text-anchor="middle" class="small">InfoDrop at stem / configured stages</text><text x="380" y="181" text-anchor="middle" class="small">global average pool = 512-D</text>
  <rect x="565" y="56" width="220" height="90" class="node"/><text x="675" y="88" text-anchor="middle" class="label">SimSiam projector</text><text x="675" y="114" text-anchor="middle" class="small">2-layer projector; SSL objective</text><text x="675" y="133" text-anchor="middle" class="small">not the official kNN tap</text>
  <rect x="565" y="180" width="220" height="86" class="node"/><text x="675" y="212" text-anchor="middle" class="label">Backbone pooled feature</text><text x="675" y="238" text-anchor="middle" class="small">512-D, pre-kNN normalization</text>
  <rect x="860" y="82" width="220" height="90" class="node"/><text x="970" y="114" text-anchor="middle" class="label">InfoDrop auxiliary path</text><text x="970" y="140" text-anchor="middle" class="small">InfoDrop view -> projector -> predictor</text><text x="970" y="159" text-anchor="middle" class="small">lambda_info * L_info</text>
  <rect x="860" y="205" width="220" height="86" class="node"/><text x="970" y="237" text-anchor="middle" class="label">Official kNN evaluation</text><text x="970" y="263" text-anchor="middle" class="small">metrics/knn_monitor.py</text>
  <path d="M205 155 H270" class="edge"/><path d="M490 132 H530 V100 H565" class="edge"/><path d="M490 173 H530 V222 H565" class="edge"/><path d="M785 101 H860" class="edge"/><path d="M785 222 H860" class="edge"/>
  <rect x="318" y="342" width="290" height="80" class="proposal"/><text x="463" y="374" text-anchor="middle" class="label">Checkpoint + fixed old probe set</text><text x="463" y="400" text-anchor="middle" class="small">eval() / no-grad; preserve sample IDs</text>
  <rect x="700" y="342" width="290" height="80" class="proposal"/><text x="845" y="374" text-anchor="middle" class="label">Frozen CTM observer</text><text x="845" y="400" text-anchor="middle" class="small">trajectory/synchrony; no loss feedback</text>
  <path d="M675 266 V312 H608 V382" class="dash"/><path d="M608 382 H700" class="dash"/>
  <text x="40" y="452" class="small">Solid = upstream behavior at commit deacb18 · Dashed = proposed read-only experiment hook</text>
</svg>
