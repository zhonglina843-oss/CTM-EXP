<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="430" viewBox="0 0 1120 430" role="img" aria-labelledby="title desc">
  <title id="title">InfoUCL documented data flow and unresolved feature tap</title>
  <desc id="desc">Official documented sequence from dataset through InfoUCL training and test evaluation; backbone and projection features are possible outputs, but the exact evaluation feature tap remains unverified. CTM probe is a proposed observation-only branch.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#385b74"/></marker>
    <marker id="dasharrow" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 Z" fill="#a46a19"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; fill: #182b3a; }
      .title { font-size: 22px; font-weight: 600; }
      .label { font-size: 16px; font-weight: 600; }
      .small { font-size: 13px; }
      .node { fill: #f1f6f8; stroke: #385b74; stroke-width: 1.5; rx: 12; }
      .proposal { fill: #fff8eb; stroke: #a46a19; stroke-width: 1.5; rx: 12; }
      .uncertain { fill: #fffdf7; stroke: #a46a19; stroke-width: 1.5; stroke-dasharray: 7 5; rx: 12; }
      .edge { fill: none; stroke: #385b74; stroke-width: 2; marker-end: url(#arrow); }
      .edge-dash { fill: none; stroke: #a46a19; stroke-width: 2; stroke-dasharray: 7 5; marker-end: url(#dasharrow); }
    </style>
  </defs>
  <text x="40" y="42" class="title">InfoUCL: documented pipeline and feature-tap decision</text>
  <rect x="40" y="100" width="190" height="95" class="node"/>
  <text x="135" y="133" text-anchor="middle" class="label">Dataset / tasks</text>
  <text x="135" y="159" text-anchor="middle" class="small">CIFAR-10 default config;</text>
  <text x="135" y="179" text-anchor="middle" class="small">MNIST / ColoredMNIST listed</text>
  <rect x="300" y="100" width="205" height="95" class="node"/>
  <text x="402" y="132" text-anchor="middle" class="label">train.py</text>
  <text x="402" y="158" text-anchor="middle" class="small">sequential UCL training</text>
  <text x="402" y="178" text-anchor="middle" class="small">InfoDrop integrated (README)</text>
  <rect x="575" y="80" width="210" height="72" class="uncertain"/>
  <text x="680" y="111" text-anchor="middle" class="label">Backbone feature</text>
  <text x="680" y="134" text-anchor="middle" class="small">candidate tap — not verified</text>
  <rect x="575" y="172" width="210" height="72" class="uncertain"/>
  <text x="680" y="203" text-anchor="middle" class="label">Projection feature</text>
  <text x="680" y="226" text-anchor="middle" class="small">candidate tap — not verified</text>
  <rect x="855" y="100" width="220" height="95" class="node"/>
  <text x="965" y="132" text-anchor="middle" class="label">test.py / metrics</text>
  <text x="965" y="158" text-anchor="middle" class="small">official feature consumer</text>
  <text x="965" y="178" text-anchor="middle" class="small">exact tensor unresolved</text>
  <path d="M230 147 H300" class="edge"/>
  <path d="M505 127 H545 V116 H575" class="edge"/>
  <path d="M505 166 H545 V208 H575" class="edge"/>
  <path d="M785 116 H855" class="edge-dash"/>
  <path d="M785 208 H825 V162 H855" class="edge-dash"/>
  <rect x="300" y="300" width="250" height="78" class="proposal"/>
  <text x="425" y="331" text-anchor="middle" class="label">Checkpointed frozen probe</text>
  <text x="425" y="356" text-anchor="middle" class="small">same fixed samples, eval + no-grad</text>
  <rect x="690" y="300" width="250" height="78" class="proposal"/>
  <text x="815" y="331" text-anchor="middle" class="label">CTM dynamics + native metrics</text>
  <text x="815" y="356" text-anchor="middle" class="small">proposal only; no training-loss change</text>
  <path d="M680 244 V275 H550 V339" class="edge-dash"/>
  <path d="M550 339 H690" class="edge-dash"/>
  <text x="40" y="408" class="small">Solid = README/root listing verified · Dashed = proposed connection or unresolved source-level behavior</text>
</svg>
