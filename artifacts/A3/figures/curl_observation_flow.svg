<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="660" viewBox="0 0 1120 660" role="img" aria-labelledby="title desc">
  <title id="title">CURL observation and proposed CTM probe flow</title>
  <desc id="desc">Verified upstream CURL path from input through shared representation, cluster posterior and continuous latent to reconstruction and ELBO. Proposed probe taps fixed-dimensional posterior-weighted latent into frozen CTM. Training events include expansion and generative replay.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#465569"/></marker>
    <style>
      text{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;fill:#152238}
      .title{font-size:24px;font-weight:700}.sub{font-size:13px;fill:#4b5d75}.box{rx:12;ry:12;stroke-width:2}.source{fill:#edf4ff;stroke:#5278b8}.derived{fill:#f2efff;stroke:#795bb3}.event{fill:#fff3df;stroke:#c18422}.probe{fill:#e6f6f1;stroke:#25866d}.label{font-size:16px;font-weight:650}.small{font-size:12px;fill:#465569}.arrow{stroke:#465569;stroke-width:2.3;fill:none;marker-end:url(#arrow)}.dashed{stroke-dasharray:7 6}
    </style>
  </defs>
  <rect width="1120" height="660" fill="#fbfcfe"/>
  <text class="title" x="42" y="44">CURL observation flow: upstream facts vs proposed CTM tap</text>
  <text class="sub" x="42" y="68">A3 source audit · official code path in blue/purple · proposed read-only probe in green · training events in amber</text>

  <rect class="box source" x="54" y="126" width="150" height="72"/>
  <text class="label" x="129" y="158" text-anchor="middle">Input x</text><text class="small" x="129" y="179" text-anchor="middle">unlabelled stream</text>
  <rect class="box source" x="258" y="126" width="190" height="72"/>
  <text class="label" x="353" y="158" text-anchor="middle">Shared encoder h(x)</text><text class="small" x="353" y="179" text-anchor="middle">get_shared_rep()</text>
  <path class="arrow" d="M204 162 H253"/>
  <rect class="box derived" x="510" y="94" width="204" height="72"/>
  <text class="label" x="612" y="125" text-anchor="middle">q(y | x)</text><text class="small" x="612" y="146" text-anchor="middle">infer_cluster · active mixture</text>
  <path class="arrow" d="M448 148 C475 148 480 130 505 130"/>
  <rect class="box derived" x="510" y="208" width="204" height="82"/>
  <text class="label" x="612" y="239" text-anchor="middle">q(z | x, y)</text><text class="small" x="612" y="260" text-anchor="middle">infer_latent · n_z continuous</text><text class="small" x="612" y="278" text-anchor="middle">posterior-weighted mean option</text>
  <path class="arrow" d="M448 174 C476 174 478 248 505 248"/>
  <rect class="box source" x="792" y="132" width="148" height="72"/>
  <text class="label" x="866" y="162" text-anchor="middle">Decoder</text><text class="small" x="866" y="183" text-anchor="middle">p(x | z, y)</text>
  <path class="arrow" d="M714 245 C753 245 753 168 787 168"/>
  <rect class="box source" x="966" y="132" width="125" height="72"/>
  <text class="label" x="1028" y="162" text-anchor="middle">ELBO</text><text class="small" x="1028" y="183" text-anchor="middle">native fit signal</text>
  <path class="arrow" d="M940 168 H961"/>

  <rect class="box probe" x="770" y="270" width="230" height="82"/>
  <text class="label" x="885" y="301" text-anchor="middle">Frozen CTM probe</text><text class="small" x="885" y="322" text-anchor="middle">fixed adapter → 20 ticks → trace</text><text class="small" x="885" y="340" text-anchor="middle">proposed observer; not upstream CURL</text>
  <path class="arrow dashed" d="M714 258 C735 258 742 308 765 308"/>
  <text class="small" x="722" y="286">proposed fixed-dim tap</text>

  <rect class="box event" x="54" y="410" width="300" height="92"/>
  <text class="label" x="204" y="443" text-anchor="middle">Dynamic expansion (verified)</text><text class="small" x="204" y="466" text-anchor="middle">poor-fit buffer → choose source component</text><text class="small" x="204" y="484" text-anchor="middle">copy params → active count +1 → tune new component</text>
  <rect class="box event" x="410" y="410" width="300" height="92"/>
  <text class="label" x="560" y="443" text-anchor="middle">Generative replay / MGR</text><text class="small" x="560" y="466" text-anchor="middle">periodic generated snapshot/buffer</text><text class="small" x="560" y="484" text-anchor="middle">alternate generated and real batches</text>
  <rect class="box probe" x="770" y="410" width="321" height="92"/>
  <text class="label" x="930" y="443" text-anchor="middle">Proposed event/record log</text><text class="small" x="930" y="466" text-anchor="middle">step · active IDs · posterior · ELBO</text><text class="small" x="930" y="484" text-anchor="middle">expansion + replay source · CTM trace</text>
  <path class="arrow dashed" d="M354 456 H405"/><path class="arrow dashed" d="M710 456 H765"/>

  <rect x="54" y="548" width="1037" height="66" rx="10" fill="#f2f4f7" stroke="#c8d0da"/>
  <text class="label" x="76" y="575">Comparison guardrail</text>
  <text class="small" x="76" y="598">Keep q(y|x) as a native metric; compare only shared component identities across expansion. Do not feed the changing categorical space to CTM in phase 1.</text>
</svg>
